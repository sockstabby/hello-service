replicaCount: 2
env:
  APP_ENV: prod
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# Spread replicas across the two AZs' nodes.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello-service
